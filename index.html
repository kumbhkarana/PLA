<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2E5E">
  <title>BIMO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- 1. LOGIN -->
  <section id="screen-login" class="screen screen-login" hidden>
    <div class="login-card">
      <img src="assets/logo.svg" alt="BIMO logo" class="login-logo">
      <h1 class="brand-title">BIMO</h1>
      <p class="brand-sub">Benefit Illustrations, made simple</p>

      <form id="login-form" autocomplete="on" novalidate>
        <label class="field">
          <span>Username</span>
          <input id="login-user" name="username" type="text" placeholder="Your name" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <div class="pw-wrap">
            <input id="login-code" name="password" type="password" inputmode="numeric" placeholder="Your code" autocomplete="current-password" required>
            <button type="button" id="toggle-pw" class="pw-toggle" aria-label="Show password">Show</button>
          </div>
        </label>
        <p id="login-error" class="error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
    </div>
  </section>

  <!-- 2. HOME / PRODUCT SELECTION -->
  <section id="screen-home" class="screen" hidden>
    <header class="topbar">
      <div class="topbar-brand"><img src="assets/logo.svg" alt=""><span>BIMO</span></div>
      <button class="btn-link logout" data-action="logout">Logout</button>
    </header>

    <div class="hero">
      <p class="hero-hello">Welcome,</p>
      <h2 class="hero-name" data-bind="agentName"></h2>
      <span class="badge-tier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg><span data-bind="agentTier"></span></span>
    </div>

    <main class="content">
      <div class="section-head">
        <h3>Select a product</h3>
        <span class="muted" id="product-count"></span>
      </div>
      <input id="product-search" class="search" type="search" placeholder="Search products">
      <div id="category-chips" class="chips" role="tablist"></div>
      <ul id="product-list" class="product-list" role="radiogroup" aria-label="Products"></ul>
    </main>

    <div class="sticky-cta">
      <button id="btn-continue" class="btn btn-accent btn-block" disabled>Continue</button>
    </div>
  </section>

  <!-- 3. BI FORM -->
  <section id="screen-form" class="screen" hidden>
    <header class="topbar">
      <button class="btn-link back" data-action="home">&larr; Products</button>
      <div class="topbar-brand"><img src="assets/logo.svg" alt=""><span>BIMO</span></div>
    </header>

    <main class="content">
      <p class="eyebrow">Generate Benefit Illustration</p>
      <h2 class="product-title" data-bind="productName"></h2>

      <div id="form-loading" class="status busy">Loading product details…</div>

      <form id="bi-form" novalidate hidden>
        <fieldset class="card">
          <legend>Life assured</legend>
          <div class="grid-form">
            <label class="field"><span>First name</span><input name="firstName" type="text" autocomplete="off" required></label>
            <label class="field"><span>Last name</span><input name="lastName" type="text" autocomplete="off"></label>
            <label class="field"><span>Date of birth <em class="age" data-age-for="dob"></em></span><input name="dob" type="date" required></label>
            <label class="field"><span>Gender</span><select name="gender" required></select></label>
          </div>
          <label class="check"><input type="checkbox" name="proposerSame" checked> Proposer is the same as life assured</label>
          <div class="grid-form" id="proposer-fields" hidden>
            <label class="field"><span>Proposer first name</span><input name="pFirstName" type="text" autocomplete="off"></label>
            <label class="field"><span>Proposer last name</span><input name="pLastName" type="text" autocomplete="off"></label>
            <label class="field"><span>Proposer date of birth <em class="age" data-age-for="pDob"></em></span><input name="pDob" type="date"></label>
            <label class="field"><span>Proposer gender</span><select name="pGender"></select></label>
          </div>
        </fieldset>

        <fieldset class="card">
          <legend>Plan details</legend>
          <div class="grid-form" id="plan-fields"></div>
        </fieldset>

        <div id="form-error" class="status error" role="alert" hidden></div>

        <button type="submit" id="btn-generate" class="btn btn-accent btn-block">Generate BI</button>
        <p class="fine">Figures are calculated live by the SUD Life Sales Illustration system.</p>
      </form>
    </main>
  </section>

  <!-- 4. ILLUSTRATION -->
  <section id="screen-result" class="screen" hidden>
    <header class="topbar">
      <button class="btn-link back" data-action="form">&larr; Edit details</button>
      <div class="topbar-brand"><img src="assets/logo.svg" alt=""><span>BIMO</span></div>
    </header>

    <main class="content result-layout">
      <div class="preview-wrap">
        <div id="illustration" class="illus"></div>
      </div>

      <div class="actions">
        <button id="btn-download" class="btn btn-accent">Download image</button>
        <button id="btn-share" class="btn btn-primary" hidden>Share</button>
        <button id="btn-pdf" class="btn btn-outline" hidden>Official BI (PDF)</button>
        <button class="btn btn-outline" data-action="home">New BI</button>
      </div>
    </main>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/html2canvas.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
